{% extends 'main.html' %}

{% block content %}

<div class="d-flex align-items-center justify-content-center  " style="min-height: 85vh;">
  {% if error %}
    <p>{{error}}</p>
  {% endif %}
    <div class="w-100 shadow p-4" style="max-width: 500px;">
      <h1 class="text-center mb-4 border-bottom border-3">Login to ChatApp</h1>
      <form class="space-y-3 " method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-control border border-2 border-secondary shadow-sm" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control border border-2 border-secondary shadow-sm" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3 text-center">
        Don't have an account? <a href="{% url 'signup' %}" class="text-primary">Sign up</a>
      </p>
    </div>
  </div>
  
  
{% endblock content %}

{% extends 'main.html' %}

{% block content %}
<div class="container py-5">
    <h1 class="text-center text-purple-400 mb-5">Stored Videos</h1>
    <div class="row g-4">
        <!-- Left Column -->
        <div class="col-md-6">
            <div class="d-flex flex-column gap-3">
                {% for video in videos %}
                <div class="card custom-card">
                    <div class="card-header">
                        <h5 class="custom-card-title">{{ video.client_id }}</h5>
                        <p>Video URL: {{ video.video.url }}</p>
                    </div>
                    <div class="card-body">
                        <p>Date: {{ video.created_at|date:"Y-m-d" }}</p>
                        <p>Duration:</p>
                        <!-- Render the video file -->
                        <video controls autoplay loop style="width: 100%; border-radius: 8px;">
                            <source src="{{ video.video.url }}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        
                        
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
